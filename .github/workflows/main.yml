name: Python Demo Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  run-python-app:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your code into the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies if you have a requirements file
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your application
      - name: Run script
        run: python app.py
